name: Build nginx with Brotli

on:
  schedule:
    # Check daily at 06:00 UTC
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Base image tag to track and build against. Must match the Dockerfile's
  # NGINX_VERSION default, or we would watch one image and build from another.
  NGINX_BASE: alpine-slim

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      nginx_version: ${{ steps.check.outputs.nginx_version }}
      nginx_digest: ${{ steps.check.outputs.nginx_digest }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest nginx base image digest
        id: check
        run: |
          # Image references must be lowercase, github.repository keeps the owner's casing
          IMAGE=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          # Pull image first so output doesn't interfere with variable capture
          docker pull "nginx:${NGINX_BASE}" > /dev/null 2>&1

          # Get current base digest (strip sha256: prefix to avoid output format issues)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "nginx:${NGINX_BASE}" | sed 's/.*@sha256://')
          echo "nginx_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          # Get nginx version (entrypoint scripts write to stdout, nginx -v writes to stderr)
          NGINX_VERSION=$(docker run --rm --entrypoint nginx "nginx:${NGINX_BASE}" -v 2>&1 | sed 's/.*nginx\///')
          echo "nginx_version=${NGINX_VERSION}" >> "$GITHUB_OUTPUT"

          # Ask the registry whether we already published a build for this digest.
          # An unreachable registry falls through to a rebuild, which is the safe direction.
          if docker buildx imagetools inspect "${IMAGE}:nginx-${DIGEST}" > /dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: nginx ${NGINX_VERSION} on ${NGINX_BASE} (${DIGEST})"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "New nginx:${NGINX_BASE} digest detected: ${DIGEST} (nginx ${NGINX_VERSION})"
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.needs_build == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-update.outputs.nginx_version }}
            type=raw,value=nginx-${{ needs.check-update.outputs.nginx_digest }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NGINX_VERSION=${{ env.NGINX_BASE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          IMAGE="${{ needs.check-update.outputs.image }}:latest"
          docker pull "$IMAGE"

          docker run --rm --entrypoint nginx "$IMAGE" -v
          echo "---"

          # Brotli is built as a dynamic module, so it never shows up in the
          # stock binary's `nginx -V` output. Check that both modules shipped...
          docker run --rm --entrypoint ls "$IMAGE" -l \
            /etc/nginx/modules/ngx_http_brotli_filter_module.so \
            /etc/nginx/modules/ngx_http_brotli_static_module.so
          echo "---"

          # ...and that nginx actually loads them: `nginx -t` processes the
          # load_module directives and fails on a missing or ABI-incompatible .so
          docker run --rm --entrypoint nginx "$IMAGE" -t
          echo "Brotli modules confirmed"
          echo "---"

          # The trimmed binaries must be gone, and the scanner database must not be
          for gone in /sbin/apk /usr/sbin/nginx-debug /usr/bin/scanelf; do
            if docker run --rm --entrypoint test "$IMAGE" -e "$gone"; then
              echo "::error::${gone} still present, trim did not apply"
              exit 1
            fi
          done
          docker run --rm --entrypoint test "$IMAGE" -s /lib/apk/db/installed
          echo "Trim confirmed, package database retained for scanners"
          echo "---"

          # cert-watch.sh is plain POSIX sh, so the trim must not have taken out
          # anything it shells out to. Checked here because nothing else would
          # notice until a certificate renewal failed to trigger a reload.
          docker run --rm --entrypoint test "$IMAGE" -x /usr/local/bin/cert-watch.sh
          docker run --rm --entrypoint test "$IMAGE" -x /docker-entrypoint.d/40-cert-watch.sh
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for cmd in inotifywait awk xargs dirname sort grep sed; do
              command -v "$cmd" > /dev/null || { echo "::error::cert-watch needs $cmd, not in image"; exit 1; }
            done'
          echo "cert-watch toolchain confirmed"
          echo "---"

          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'

      - name: Verify hardened runtime
        run: |
          IMAGE="${{ needs.check-update.outputs.image }}:latest"

          # Turn brotli on so this exercises the module rather than just
          # proving it loaded. The stock index.html is ~600 bytes.
          cat > /tmp/brotli.conf <<'CONF'
          server {
              listen 80;
              brotli on;
              brotli_min_length 100;
              location / { root /usr/share/nginx/html; index index.html; }
          }
          CONF

          # The flags this image is built to run under: nothing writable except
          # two tmpfs mounts, and no capability beyond binding a low port.
          docker run -d --name hardened \
            --read-only \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --tmpfs /tmp:mode=1777 \
            --tmpfs /var/cache/nginx:uid=101,gid=101 \
            -v /tmp/brotli.conf:/etc/nginx/conf.d/default.conf:ro \
            -p 8080:80 \
            "$IMAGE"

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            if [ "$i" -eq 30 ]; then
              echo "::error::container never served a request"
              docker logs hardened
              exit 1
            fi
            sleep 1
          done

          RUNNING_UID=$(docker exec hardened id -u)
          if [ "$RUNNING_UID" != "101" ]; then
            echo "::error::running as uid ${RUNNING_UID}, expected 101"
            exit 1
          fi
          echo "Serving on :80 as uid ${RUNNING_UID}, read-only rootfs, CAP_NET_BIND_SERVICE only"

          ENC=$(curl -fsS -H 'Accept-Encoding: br' -o /dev/null -D - http://localhost:8080/ \
                | tr -d '\r' | awk 'tolower($1) == "content-encoding:" { print $2 }')
          if [ "$ENC" != "br" ]; then
            echo "::error::expected a brotli-encoded response, got '${ENC:-none}'"
            docker logs hardened
            exit 1
          fi
          echo "Brotli compression confirmed end to end (content-encoding: br)"

          docker rm -f hardened > /dev/null

      - name: Prune old image versions (keep last 7)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 7

  keepalive:
    # Scheduled workflows are auto-disabled after 60 days without repository
    # activity. Scheduled runs don't count, so push an empty commit before we
    # hit that window. GITHUB_TOKEN pushes never trigger workflow runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push keepalive commit if repository is going stale
        run: |
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: ${DAYS}"

          if [ "$DAYS" -lt 45 ]; then
            echo "Repository still active, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow disablement [skip ci]"
          git push
